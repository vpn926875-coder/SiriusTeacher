<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поздравление учителю</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0712;--card:#150e22;--field:#1d1330;--line:#2e2046;--text:#f1eaff;--mute:#a497c4;--a:#8b5cf6;--b:#6d28d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0b0712}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#2a1253 0,var(--bg) 55%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:640px}
h1{font-size:clamp(26px,5vw,36px);margin:0 0 10px;line-height:1.2}
h1 span{background:linear-gradient(90deg,#c4b5fd,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--mute);margin:0 0 24px;line-height:1.55}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 20px 60px rgba(109,40,217,.18)}
label{display:block;font-size:13px;color:var(--mute);margin:16px 0 8px}
main .card>label:first-child{margin-top:0}
input,textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:18px;color:var(--text);padding:14px 16px;font:inherit;outline:none;transition:.2s}
input:focus,textarea:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 4px rgba(139,92,246,.2)}
textarea{min-height:120px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
button{border:0;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:.2s}
.go{width:100%;margin-top:22px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 10px 30px rgba(139,92,246,.4)}
.go:hover{transform:translateY(-2px)}
.go:disabled{opacity:.6;cursor:wait;transform:none}
.out{display:none;margin-top:20px}
.out.show{display:block;animation:in .4s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.text{background:var(--field);border:1px solid var(--line);border-radius:22px;padding:20px;line-height:1.65;white-space:pre-wrap}
.acts{display:flex;gap:10px;margin-top:12px}
.acts button{flex:1;padding:12px;background:var(--field);color:var(--text);border:1px solid var(--line)}
.acts button:hover{border-color:var(--a)}
.err{color:#fda4af;margin-top:14px;font-size:14px}
</style>
</head>
<body>
<main>
<h1>Поздравление, в котором <span>есть вы</span></h1>
<p class="lead">Расскажите, что на самом деле связывает вас с учителем. ИИ соберёт из ваших слов тёплое поздравление ко Дню учителя — без шаблонов и дежурных фраз.</p>
<div class="card">
  <label>Имя учителя</label>
  <input id="name" placeholder="Например, Марина Сергеевна">
  <div class="row">
    <div><label>Предмет</label><input id="subj" placeholder="Литература"></div>
    <div><label>Кто вы</label><select id="who"><option>Ученик</option><option>Бывший ученик</option><option>Родитель</option><option>Коллега</option></select></div>
  </div>
  <label>Ваши отношения и что вы вспоминаете</label>
  <textarea id="story" placeholder="Как она поддержала вас, какой случай запомнился, чему научила, что хочется сказать, но обычно не говорится…"></textarea>
  <label>Стиль</label>
  <select id="tone"><option>Тёплый и искренний</option><option>Тёплый с лёгким юмором</option><option>Короткий и сдержанный</option><option>Торжественный</option></select>
  <button class="go" id="go">Создать поздравление</button>
  <div class="err" id="err"></div>
  <div class="out" id="out">
    <div class="text" id="res"></div>
    <div class="acts"><button id="copy">Копировать</button><button id="again">Ещё вариант</button></div>
  </div>
</div>
</main>
